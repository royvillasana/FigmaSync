version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: uxbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Supabase local stack
  # Run: npx supabase start (preferred) or use this service for CI
  supabase-db:
    image: supabase/postgres:15.6.1.056
    container_name: uxbridge-supabase-db
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./packages/db/src/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  supabase_db_data:

networks:
  default:
    name: uxbridge-network
